<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>spacewarjs</title>
  </head>
  <body>
  <div id="app">
    <h1>Spacewar!</h1>
    <p>a Typescript implementation with no framework or other external libraries.</p>
    <section id="content">
      <div id="first-panel">
        <button id="start-stop-button">Start</button>
        <button id="step-button">Step</button>
        <label class="option-control">Round screen: <input type="checkbox" id="round-screen" name="round-screen"/></label>
      </div>
      <div id="middle-panel">
        <div id="screen" class="screen round-screen">
        </div>
      </div>
      <div id="last-panel">
        <div id="ship-1-controls" data-object-id="ship-1" class="controls">
          <h2>Ship 1</h2>
          <ul id="ship-1-controls-fieldset">
            <li class="property-display vector">
              <div class="label">Position:</div>
              <div id="ship-1-position-x" class="value value1 position-x" ></div>
              <div id="ship-1-position-y" class="value value2 position-y" ></div>
            </li>
            <li class="property-display">
              <div class="label">Engine:</div>
              <div class="value engine-state">off</div></li>
            <li class="property-display">
              <div class="label">Facing:</div>
              <div id="ship-1-facing" class="value ship-facing"></div>
            </li>
            <li class="property-display vector">
              <div class="label">Velocity:</div>
              <div id="ship-1-velocity-magnitude" class="value value1 ship-velocity-magnitude"></div>
              <div id="ship-1-velocity-direction" class="value value2 ship-velocity-direction"></div>
            </li>
          </ul>
        </div>
        <div class="user-messages">
          <div class="torpedo-status">
            <ul class="torpedo-log">
            
            </ul>
          </div>
          <div class="collisions">
          </div>
        </div>
        <div id="ship-2-controls" data-object-id="ship-2" class="controls">
          <h2>Ship 2</h2>
          <ul id="ship-2-controls-fieldset">
            <li class="property-display vector">
              <div class="label">Position:</div>
              <div id="ship-2-position-x" class="value value1 position-x" ></div>
              <div id="ship-2-position-y" class="value value2 position-y" ></div>
            </li>
            <li class="property-display">
              <div class="label">Engine:</div>
              <div class="value engine-state">off</div></li>
            <li class="property-display">
              <div class="label">Facing:</div>
              <div id="ship-2-facing" class="value ship-facing"></div>
            </li>
            <li class="property-display vector">
              <div class="label">Velocity:</div>
              <div id="ship-2-velocity-magnitude" class="value value1 ship-velocity-magnitude"></div>
              <div id="ship-2-velocity-direction" class="value value2 ship-velocity-direction"></div>
            </li>
          </ul>
        </div>
      </div>
    </section>
  </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
